# sandpit configuration — data leak prevention (global)
# Portable built-in policy; organization-specific rules belong in local configuration.
#
# This is a GLOBAL config — it applies to any repo the agent works in,
# whether private corporate, personal private, or public open-source.
#
# Goals:
#   1. Block uploading to GitHub Gist and similar snippet/paste services
#   2. Block all public sharing / paste websites
#   3. Prevent code from private repos being leaked to public destinations
#      (but allow normal pushes from public/open-source repos)
#
# Strategy:
#   - Paste/share/upload sites → network block (deterministic, zero-judgment)
#   - Gist creation → exec block on `gh gist` CLI + adversary catches API calls
#   - Git push to wrong place → adversary layer (needs to inspect source AND dest)
#   - GitHub/GitLab/etc are NOT network-blocked — you need them for deps & docs

[network]
# SSH Git transport; resolved once and constrained to these endpoints/port.
ssh = []
# Block paste sites, file sharing, and tunneling services.
# Subdomains are included automatically.
